name: Build DailySmart V2 Native
on:
  push:
    branches: [dev]
    paths:
      - 'DailySmartV2/**'
      - '.github/workflows/build-dailysmart-v2.yml'
  workflow_dispatch:
concurrency:
  group: dailysmart-dev-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build standalone V2 APK
        working-directory: DailySmartV2
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify package and APK
        working-directory: DailySmartV2
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.dailysmart.app.v2'"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailySmart-V2-Native-APK
          path: DailySmartV2/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
