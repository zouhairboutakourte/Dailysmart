name: Build Dailio Android APK
on:
  push:
    branches: [dev]
    paths:
      - 'Dailio/**'
      - '.github/workflows/build-dailio.yml'
  workflow_dispatch:
concurrency:
  group: dailio-dev-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Run finance tests and build Dailio
        working-directory: Dailio
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify standalone package id
        working-directory: Dailio
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.dailio.app'"
      - name: Upload Dailio APK
        uses: actions/upload-artifact@v4
        with:
          name: Dailio-Android-APK
          path: Dailio/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
