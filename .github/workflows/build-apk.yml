name: Build APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dézipper le projet
        run: unzip -o DailySmart-projet.zip -d build_src

      - name: Appliquer les corrections de sécurité
        run: python3 scripts/apply_safety_fixes.py build_src/DailySmart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compiler l'APK
        working-directory: build_src/DailySmart
        run: gradle assembleDebug --stacktrace

      - name: Upload source for review
        uses: actions/upload-artifact@v4
        with:
          name: DailySmart-Source-Audit
          path: build_src/DailySmart/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: DailySmart-APK
          path: build_src/DailySmart/app/build/outputs/apk/debug/*.apk
